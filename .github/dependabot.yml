version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 10
    groups:
      next:
        patterns: ["next", "eslint*"]
      convex:
        patterns: ["convex*"]
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope
